# Reconstructed MVP scaffolding — original source unavailable.
#
# Standard Alembic-generated boilerplate (matches what `alembic init` produces
# by default) — no project-specific values are baked in here. env.py (restored
# from files4.zip) overrides sqlalchemy.url from Settings.alembic_database_url
# at runtime regardless of what's set below. See RECOVERY_MANIFEST.md.

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
