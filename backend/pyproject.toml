[project]
name = "ali-trading-dashboard-backend"
version = "1.0.0"
description = "Ali Trading Dashboard — Backend (Core Infrastructure)"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",  # MVP Phase 4 patch: 0.30.x has no Python 3.14
    # Windows wheel; 0.31.0 does. Not a behavioral change. See RECOVERY_MANIFEST.md.
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.14,<1.15",
    "redis>=5.2,<6.0",
    "python-dotenv>=1.0,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "PyJWT>=2.9,<3.0",
]
# MVP Phase 2 patch — email-validator (files12.zip/Phase 3.0), argon2-cffi
# (files13.zip/Phase 3.1), and PyJWT (files15.zip/Phase 3.3) added: each was
# documented in its phase report as an added dependency, but no updated
# pyproject.toml was ever archived. Version constraints copied verbatim from
# those reports. `redis` is unused in this MVP (Redis/cache wiring was
# dropped, see main.py) but left in place since it was already present in
# the archived Phase 1 pyproject.toml. See RECOVERY_MANIFEST.md.

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
